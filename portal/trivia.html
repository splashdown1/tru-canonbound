<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TRU · Trivia</title>
<style>
  :root { --bg:#070b10; --panel:#0e1720; --line:#214052; --text:#d5e4ee; --dim:#7e96a7; --accent:#7fd0c4; --warn:#e2b15a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 ui-sans-serif, system-ui, sans-serif; }
  header { padding:18px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:12px; align-items:end; }
  h1 { margin:0; font-size:18px; letter-spacing:.14em; }
  a { color:var(--accent); }
  .meta { color:var(--dim); font-size:12px; margin-top:6px; }
  main { max-width:720px; margin:0 auto; padding:16px; }
  .card { border:1px solid var(--line); border-radius:12px; padding:14px; background:var(--panel); }
  button { display:block; width:100%; text-align:left; margin-top:8px; background:#10202b; color:var(--text); border:1px solid var(--line); border-radius:10px; padding:12px 14px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.good { border-color:var(--accent); color:var(--accent); }
  button.bad { border-color:var(--warn); color:var(--warn); }
  .tag { color:var(--accent); font-size:11px; letter-spacing:.12em; text-transform:uppercase; }
  .src { color:var(--dim); font-size:13px; margin-top:10px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>TRU · TRIVIA</h1>
    <div class="meta" id="meta">Public-domain KJV. No account. No score leaves this page.</div>
  </div>
  <a href="index.html">Lanes</a>
</header>
<main>
  <div class="card" id="card"></div>
</main>
<script>
const Q = [
  {q:"Finish the verse: In the beginning God created…", choices:["the heaven and the earth","man in his own image","light, and there was light","a garden eastward in Eden"], a:0, ref:"Genesis 1:1", text:"In the beginning God created the heaven and the earth."},
  {q:"Who said, Let there be light?", choices:["Moses","God","Adam","the serpent"], a:1, ref:"Genesis 1:3", text:"And God said, Let there be light: and there was light."},
  {q:"The LORD is my shepherd; I shall not…", choices:["fear","want","fall","hunger"], a:1, ref:"Psalm 23:1", text:"The LORD is my shepherd; I shall not want."},
  {q:"Thy word is a lamp unto my feet, and a light unto my…", choices:["eyes","path","house","soul"], a:1, ref:"Psalm 119:105", text:"Thy word is a lamp unto my feet, and a light unto my path."},
  {q:"Trust in the LORD with all thine heart; and lean not unto thine own…", choices:["strength","understanding","works","wisdom"], a:1, ref:"Proverbs 3:5", text:"Trust in the LORD with all thine heart; and lean not unto thine own understanding."},
  {q:"For unto us a child is born, unto us a son is…", choices:["promised","given","sent","named"], a:1, ref:"Isaiah 9:6", text:"For unto us a child is born, unto us a son is given."},
  {q:"For God so loved the world, that he gave his only begotten…", choices:["law","Son","word","spirit"], a:1, ref:"John 3:16", text:"For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life."},
  {q:"Jesus saith unto him, I am the way, the truth, and the…", choices:["light","life","door","vine"], a:1, ref:"John 14:6", text:"Jesus saith unto him, I am the way, the truth, and the life: no man cometh unto the Father, but by me."},
  {q:"Neither is there salvation in any other: for there is none other…", choices:["temple","name under heaven","sacrifice","priest"], a:1, ref:"Acts 4:12", text:"Neither is there salvation in any other: for there is none other name under heaven given among men, whereby we must be saved."},
  {q:"For the wages of sin is death; but the gift of God is…", choices:["long life","eternal life through Jesus Christ our Lord","wisdom","peace on earth"], a:1, ref:"Romans 6:23", text:"For the wages of sin is death; but the gift of God is eternal life through Jesus Christ our Lord."},
  {q:"For by grace are ye saved through faith; and that not of yourselves: it is the…", choices:["reward of works","gift of God","law of Moses","hope of man"], a:1, ref:"Ephesians 2:8", text:"For by grace are ye saved through faith; and that not of yourselves: it is the gift of God."},
  {q:"Now faith is the substance of things hoped for, the evidence of things…", choices:["promised","not seen","to come","written"], a:1, ref:"Hebrews 11:1", text:"Now faith is the substance of things hoped for, the evidence of things not seen."},
  {q:"Even so faith, if it hath not works, is…", choices:["enough","dead, being alone","hidden","strong"], a:1, ref:"James 2:17", text:"Even so faith, if it hath not works, is dead, being alone."},
  {q:"In the beginning was the Word, and the Word was with God, and the Word…", choices:["was God","became law","was silent","was a man only"], a:0, ref:"John 1:1", text:"In the beginning was the Word, and the Word was with God, and the Word was God."},
  {q:"All scripture is given by inspiration of God, and is profitable for…", choices:["debate","doctrine, for reproof, for correction, for instruction in righteousness","sale","secret knowledge"], a:1, ref:"2 Timothy 3:16", text:"All scripture is given by inspiration of God, and is profitable for doctrine, for reproof, for correction, for instruction in righteousness."}
];
let order = Q.map((_,i)=>i).sort(()=>Math.random()-0.5);
let n = 0, hit = 0, locked = false;
function draw(){
  const card = document.getElementById("card");
  if (n >= order.length){
    card.innerHTML = `<div class="tag">Done</div><p>${hit} of ${order.length} matched the verse on the card.</p><p class="src">Nothing was saved. Nothing was sent.</p><button id="again">Again</button>`;
    document.getElementById("again").onclick = () => { order = Q.map((_,i)=>i).sort(()=>Math.random()-0.5); n = 0; hit = 0; draw(); };
    return;
  }
  const item = Q[order[n]];
  card.innerHTML = `<div class="tag">${n+1} / ${order.length} · ${hit} held</div><p>${item.q}</p>` + item.choices.map((c,i)=>`<button data-i="${i}">${c}</button>`).join("");
  card.querySelectorAll("button").forEach(btn => btn.onclick = () => pick(btn, item));
}
function pick(btn, item){
  if (locked) return;
  locked = true;
  const i = Number(btn.dataset.i);
  const buttons = [...btn.parentElement.querySelectorAll("button")];
  buttons[item.a].classList.add("good");
  if (i === item.a) hit++;
  else btn.classList.add("bad");
  const note = document.createElement("div");
  note.className = "src";
  note.textContent = item.ref + " · " + item.text;
  btn.parentElement.appendChild(note);
  setTimeout(() => { locked = false; n++; draw(); }, 900);
}
draw();
</script>
</body>
</html>
